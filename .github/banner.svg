<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#0A1F33"/><stop offset=".5" stop-color="#175487"/>
 <stop offset=".82" stop-color="#2E86B8"/><stop offset="1" stop-color="#E8B84B"/>
</linearGradient>
<radialGradient id="sun" cx=".82" cy=".5" r=".5">
 <stop offset="0" stop-color="#FFF3C4"/><stop offset=".35" stop-color="#FFD86B"/>
 <stop offset="1" stop-color="#FFD86B" stop-opacity="0"/>
</radialGradient>
<linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C89A2E"/><stop offset="1" stop-color="#8F6A1B"/></linearGradient>
<linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0B245"/><stop offset="1" stop-color="#B08428"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
<g id="stalk">
 <path d="M0,0 Q4,-52 2,-104" stroke="#5C4310" stroke-width="4" fill="none"/>
 <ellipse cx="0" cy="-102" rx="6" ry="14" fill="#6B4F12"/>
 <ellipse cx="-7" cy="-90" rx="5" ry="11" fill="#7A5B15" transform="rotate(-24 -7 -90)"/>
 <ellipse cx="9" cy="-88" rx="5" ry="11" fill="#7A5B15" transform="rotate(24 9 -88)"/>
 <ellipse cx="-8" cy="-74" rx="5" ry="10" fill="#6B4F12" transform="rotate(-26 -8 -74)"/>
 <ellipse cx="10" cy="-72" rx="5" ry="10" fill="#6B4F12" transform="rotate(26 10 -72)"/>
</g>
</defs>
<rect width="1280" height="400" fill="url(#sky)"/>
<circle cx="1050" cy="200" r="260" fill="url(#sun)"/>
<circle cx="1050" cy="200" r="80" fill="#FFE9A8" opacity=".9"/>
<!-- birds -->
<g stroke="#0B3D6E" stroke-width="4" fill="none" opacity=".65" stroke-linecap="round">
 <path d="M300,120 q14,-12 28,0 q14,-12 28,0"/><path d="M380,95 q11,-9 22,0 q11,-9 22,0"/>
</g>
<!-- hills -->
<path d="M0,300 C220,260 420,320 640,300 C900,276 1080,320 1280,290 L1280,400 L0,400 Z" fill="url(#h1)"/>
<path d="M0,340 C260,310 520,360 780,336 C1020,314 1160,352 1280,332 L1280,400 L0,400 Z" fill="url(#h2)"/>
<!-- wheat -->
<g filter="url(#soft)" opacity=".9">
 <use href="#stalk" transform="translate(60,400) scale(1.2)"/>
 <use href="#stalk" transform="translate(130,400) scale(1.4) rotate(4)"/>
 <use href="#stalk" transform="translate(1180,400) scale(1.3) rotate(-4)"/>
 <use href="#stalk" transform="translate(1240,400) scale(1.5) rotate(5)"/>
</g>
<!-- title -->
<text x="70" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#FFFFFF">AgriSentinel</text>
<text x="74" y="228" font-family="Arial, sans-serif" font-size="24" fill="#EAF3FB">An Explainable Early-Warning System for National Food-Security Risk</text>
<text x="74" y="266" font-family="Arial, sans-serif" font-size="18" fill="#FFD86B" letter-spacing="1.5">FAOSTAT + World Bank &#183; 180 countries &#183; 2010&#8211;2023 &#183; SHAP explainability</text>
</svg>
